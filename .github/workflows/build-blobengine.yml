name: Build BlobEngine for Windows

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Checkout BlobEngine customizations
        uses: actions/checkout@v4

      - name: Download Cheat Engine 7.5 source
        shell: pwsh
        run: |
          git clone --depth 1 --branch 7.5 https://github.com/cheat-engine/cheat-engine.git upstream
          if ($LASTEXITCODE -ne 0) { throw "Could not clone Cheat Engine 7.5 tag" }

      - name: Apply BlobEngine branding and Lua tools
        shell: pwsh
        run: |
          $root = Join-Path $PWD "upstream"
          New-Item -ItemType Directory -Force (Join-Path $root "BlobEngine/profiles") | Out-Null
          Copy-Item "BlobEngine/BlobEngineDashboard.lua" (Join-Path $root "BlobEngine/")
          Copy-Item "BlobEngine/BlobEngineNameSearch.lua" (Join-Path $root "BlobEngine/")
          Copy-Item "BlobEngine/profiles/catalog.example.json" (Join-Path $root "BlobEngine/profiles/")
          Copy-Item "BlobEngine/README_BLOBENGINE.md" (Join-Path $root "BlobEngine/")
          $lpi = Join-Path $root "Cheat Engine/cheatengine.lpi"
          $lfm = Join-Path $root "Cheat Engine/MainUnit.lfm"
          if (!(Test-Path $lpi) -or !(Test-Path $lfm)) { throw "Expected Lazarus project files not found in upstream tag" }
          $s = Get-Content $lpi -Raw
          $s = [regex]::Replace($s, '<Title Value="[^"]*"', '<Title Value="BlobEngine 7.5"', 1)
          $s = $s -replace 'bin\\cheatengine-', 'bin\\blobengine-'
          Set-Content -Path $lpi -Value $s -Encoding UTF8
          $s = Get-Content $lfm -Raw
          $s = $s.Replace("Caption = 'Cheat Engine'", "Caption = 'BlobEngine'")
          Set-Content -Path $lfm -Value $s -Encoding UTF8

      - name: Download and install Lazarus 2.2.2 / FPC 3.2.2
        shell: pwsh
        run: |
          $installer = Join-Path $env:RUNNER_TEMP "lazarus-2.2.2-fpc-3.2.2-win64.exe"
          $url = "https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2064%20bits/Lazarus%202.2.2/lazarus-2.2.2-fpc-3.2.2-win64.exe"
          curl.exe --location --fail --retry 5 --retry-all-errors --output $installer $url
          if ($LASTEXITCODE -ne 0) { throw "Lazarus download failed (curl exit $LASTEXITCODE)" }
          if (!(Test-Path $installer)) { throw "Lazarus installer was not downloaded" }
          $file = Get-Item $installer
          if ($file.Length -lt 50000000) { throw "Downloaded Lazarus installer is unexpectedly small ($($file.Length) bytes); refusing to execute an invalid download" }
          $stream = [System.IO.File]::OpenRead($installer)
          try {
            $magic = New-Object byte[] 2
            [void]$stream.Read($magic, 0, 2)
          } finally { $stream.Dispose() }
          if ($magic[0] -ne 0x4D -or $magic[1] -ne 0x5A) { throw "Downloaded file is not a Windows executable (missing MZ signature)" }
          $p = Start-Process -FilePath $installer -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/DIR=C:\lazarus") -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "Lazarus installer exited with code $($p.ExitCode)" }
          if (!(Test-Path "C:\lazarus\lazbuild.exe")) { throw "lazbuild.exe not found after installation" }

      - name: Build 64-bit BlobEngine
        shell: pwsh
        working-directory: upstream/Cheat Engine
        run: |
          & "C:\lazarus\lazbuild.exe" --build-mode="Release 64-Bit" cheatengine.lpi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $PWD "bin\blobengine-x86_64.exe"
          $lua = Join-Path $PWD "bin\\lua53-64.dll"
          if (!(Test-Path $exe)) { throw "Build finished but EXE was not found: $exe" }
          if (!(Test-Path $lua)) { throw "Required Lua runtime was not found: $lua" }
          Get-Item $exe,$lua | Format-Table FullName,Length

      - name: Prepare portable package
        shell: pwsh
        working-directory: upstream/Cheat Engine
        run: |
          $dist = Join-Path $PWD "dist"
          New-Item -ItemType Directory -Force $dist | Out-Null
          Copy-Item "bin\\blobengine-x86_64.exe" $dist
          Copy-Item "bin\\lua53-64.dll" $dist
          # Ship upstream translation catalogs, including the existing Russian locale.
          if (Test-Path "bin\\languages") {
            Copy-Item "bin\\languages" (Join-Path $dist "languages") -Recurse -Force
          } else {
            throw "Language catalog folder is missing; Russian UI cannot be offered"
          }
          # Include BlobEngine tools and install the dashboard as an autorun startup script.
          Copy-Item "..\\..\\BlobEngine" (Join-Path $dist "BlobEngine") -Recurse -Force
          $autorun = Join-Path $dist "autorun"
          New-Item -ItemType Directory -Force $autorun | Out-Null
          Copy-Item "..\\..\\BlobEngine\\BlobEngineDashboard.lua" (Join-Path $autorun "BlobEngineDashboard.lua")
          if (!(Test-Path (Join-Path $dist "blobengine-x86_64.exe")) -or !(Test-Path (Join-Path $dist "lua53-64.dll")) -or !(Test-Path (Join-Path $dist "languages\\ru_RU\\cheatengine-x86_64.po"))) {
            throw "Portable package is incomplete or Russian translation catalog is missing"
          }
          Get-ChildItem $dist | Format-Table Name,Length

      - name: Upload portable Windows x64 package
        uses: actions/upload-artifact@v4
        with:
          name: BlobEngine-Windows-x64-Portable
          path: upstream/Cheat Engine/dist/*
          if-no-files-found: error
          retention-days: 14
